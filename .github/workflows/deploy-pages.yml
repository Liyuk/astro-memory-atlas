name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the Chinese font subsets
        run: |
          python3 -m venv /tmp/fontcheck
          /tmp/fontcheck/bin/pip install fonttools brotli
          /tmp/fontcheck/bin/python scripts/subset-font.py --check

      - name: Run tests and build the site once
        run: npm test
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Prepare Pages artifact
        run: |
          mkdir --parents _site
          rsync --archive dist/ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
